# ─── kitty — apparence ─── Catppuccin Mocha ──────────────────────────────────
# Inclus par ~/.config/kitty/kitty.conf via themes/current/kitty.conf.
#
# Note : à ce stade ce thème ne définit pas de palette de couleurs — kitty
# utilise donc ses couleurs par défaut, exactement comme avant l'extraction.
# Pour une vraie palette Catppuccin, ajouter ici les directives
# `foreground` / `background` / `color0..15`.

background_opacity 0.8
font_family ComicShannsMono Nerd Font
