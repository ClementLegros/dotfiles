# ─── GTK / curseur — apparence ─── Catppuccin Mocha ──────────────────────────
# Lu par theme-switch (voir themes/frutiger-aero/gtk.conf pour le format).
#
# Aucun thème GTK Catppuccin n'est installé sur cette machine : on reste sur
# Adwaita en variante sombre, ce qui est cohérent avec Mocha. Pour un vrai
# thème, installer par ex. `catppuccin-gtk-theme-mocha` (AUR) et remplacer
# gtk_theme ci-dessous.

gtk_theme=Adwaita
icon_theme=Papirus-Dark
cursor_theme=Adwaita
cursor_size=24
font=Noto Sans 11
document_font=Noto Sans 11
monospace_font=ComicShannsMono Nerd Font 11
color_scheme=prefer-dark
