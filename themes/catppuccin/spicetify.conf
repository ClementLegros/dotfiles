# Quel thème spicetify appliquer, et avec quel jeu de couleurs de son color.ini.
#
# Ici le thème n'est PAS fourni par ce dossier : catppuccin est déjà installé
# dans ~/.config/spicetify/Themes/catppuccin (via le marketplace spicetify).
# theme-switch se contente donc de le sélectionner.

theme=catppuccin
color_scheme=mocha
