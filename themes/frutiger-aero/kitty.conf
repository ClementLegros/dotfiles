# ─── kitty — apparence ─── Frutiger Aero ─────────────────────────────────────
# Inclus par ~/.config/kitty/kitty.conf via themes/current/kitty.conf.
#
# Choix assumé : le terminal reste SOMBRE. Frutiger Aero est un style clair,
# mais une plaque de verre claire derrière du code est illisible plusieurs
# heures d'affilée. On garde donc la logique du style — verre, eau, lumière —
# en la transposant : ce n'est pas de la vitre au soleil, c'est de l'eau vue
# depuis le fond. Fond bleu abyssal, accents aqua et lime saturés.

font_family      ComicShannsMono Nerd Font
font_size        11.0

# 0.78 : assez transparent pour que le flou d'Hyprland donne l'effet d'eau,
# assez opaque pour que le texte reste net sur un fond d'écran chargé.
background_opacity 0.78

cursor_shape        beam
cursor_beam_thickness 2.0
window_padding_width 8

# ── Palette ──
foreground           #d8f1ff
background           #041e33
selection_foreground #041e33
selection_background #7fe3f0

cursor               #7fe3f0
cursor_text_color    #041e33

url_color            #4fc3f7

active_border_color   #4fc3f7
inactive_border_color #0b4c8c

active_tab_foreground   #041e33
active_tab_background   #7fe3f0
inactive_tab_foreground #7fa8c4
inactive_tab_background #062a4a

# noir / gris
color0  #0a3352
color8  #3d7ba6
# rouge — corail
color1  #ff6b57
color9  #ff8f7e
# vert — lime Aero
color2  #9ede4a
color10 #b8ef6e
# jaune — soleil filtré par l'eau
color3  #ffd24a
color11 #ffe07d
# bleu — azur
color4  #4fc3f7
color12 #7fd7ff
# magenta — anémone
color5  #d98fe0
color13 #eaadf0
# cyan — aqua, la couleur signature
color6  #7fe3f0
color14 #a8f0f8
# blanc — écume
color7  #d8f1ff
color15 #ffffff
