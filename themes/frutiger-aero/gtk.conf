# ─── GTK / curseur — apparence ─── Frutiger Aero ─────────────────────────────
# Lu par theme-switch, qui en dérive gtk-3.0/settings.ini, gtk-4.0/settings.ini,
# les clés gsettings (pour GTK4/libadwaita, qui ignore settings.ini) et
# `hyprctl setcursor`.
#
# Format : clé=valeur, une par ligne. Pas de guillemets.
#
# gtk_theme / icon_theme / cursor_theme désignent des NOMS DE DOSSIER sous
# ~/.themes, ~/.local/share/icons ou /usr/share/{themes,icons} — pas le champ
# Name= des index.theme, que GTK n'utilise pas pour la résolution.

gtk_theme=diinki-aero
icon_theme=crystal-remix-icon-theme-diinki-version
cursor_theme=Bibata-Modern-Ice
cursor_size=24
font=Inter 11
document_font=Inter 11
monospace_font=ComicShannsMono Nerd Font 11
color_scheme=prefer-light
