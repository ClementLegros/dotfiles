; ─── spicetify — palette ─── Frutiger Aero ──────────────────────────────────
; spicetify substitue ces jetons dans le CSS de Spotify avant de l'injecter.
; Un thème CLAIR : c'est le parti pris Frutiger Aero, et ça met en valeur les
; pochettes au lieu de les noyer.
;
; Note : pas de « # » devant les couleurs — spicetify attend du hex nu.

[aero]
text               = 06355c
subtext            = 3d7ba6
main               = eaf8fd
main-elevated      = ffffff
highlight          = d3eefc
highlight-elevated = e4f6fe
sidebar            = d4eefb
player             = c9e9f8
card               = ffffff
shadow             = 9cc9e4
selected-row       = 1e88e5
button             = 1e88e5
button-active      = 0b4c8c
button-disabled    = 9cc0d6
tab-active         = ffffff
notification       = d6f2fb
notification-error = e8442f
equalizer          = 4fc3f7
misc               = 7fe3f0
