# ─── hyprlock — apparence ─── Frutiger Aero ──────────────────────────────────
# Sourcé par ~/.config/hypr/hyprlock.conf via themes/current/hyprlock.conf.

background {
    monitor =
    path = ~/.config/themes/current/wallpaper.jpg
    blur_passes = 3
    blur_size = 8
    # Contrairement au thème sombre, on ÉCLAIRCIT : l'écran de verrouillage
    # Aero est une vitre embuée devant une piscine, pas une vitre teintée.
    brightness = 1.05
    contrast = 1.05
    vibrancy = 0.3
}

# Halo de verre derrière le champ de saisie — la « bulle ».
shape {
    monitor =
    size = 420, 150
    color = rgba(ffffff26)
    border_size = 1
    border_color = rgba(ffffff80)
    rounding = 24
    position = 0, -60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 52
    outline_thickness = 2
    dots_size = 0.26
    dots_spacing = 0.25
    dots_center = true
    rounding = 26
    outer_color = rgba(ffffffcc)
    inner_color = rgba(0b4c8c8c)
    font_color = rgba(ffffffff)
    fade_on_empty = false
    placeholder_text = <span foreground="##d6f2fbcc">Mot de passe...</span>
    fail_text = <span foreground="##ff8f7e">$FAIL <b>($ATTEMPTS)</b></span>
    check_color = rgba(9ede4aff)
    fail_color = rgba(ff6b57ff)
    capslock_color = rgba(ffd24aff)
    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(ffffffff)
    # L'ombre portée, ici, n'est pas décorative : le fond d'écran clair rend
    # du texte blanc illisible sans elle.
    shadow_passes = 3
    shadow_size = 5
    shadow_color = rgba(041e3399)
    font_size = 72
    font_family = Inter SemiBold
    position = 0, 170
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A %d %B"
    color = rgba(d6f2fbff)
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(041e3399)
    font_size = 18
    font_family = Inter
    position = 0, 95
    halign = center
    valign = center
}
