[General]
# Fond d'écran : le même que hyprpaper/hyprlock, copié ici car le greeter
# tourne sous l'utilisateur `sddm` et ne peut pas lire /home/optimusprime (700).
Background="backgrounds/wallpaper.jpg"

# Le flou est appliqué par le thème (QtQuick.Effects), pas par un compositeur :
# il n'y en a pas au moment du login. Valeurs en pixels de rayon max.
BlurRadius="42"
# Comme sur hyprlock : on ÉCLAIRCIT, on ne teinte pas.
Brightness="0.06"
Saturation="0.18"

Font="Inter"
FontSize="11"

# Les bulles montantes. Mettre 0 pour les désactiver.
BubbleCount="16"

# Horloge
ClockEnabled="true"
Locale="fr_FR"

# Décommenter pour afficher la dernière lettre du mot de passe N ms.
# PasswordShowLastLetter="700"
