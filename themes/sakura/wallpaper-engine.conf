# ─── Fond d'écran animé (Wallpaper Engine) ─── Sakura ────────────────────────
# Optionnel. Lu par themes/bin/wallpaper-apply. Tant que `bg` est commenté —
# ou que linux-wallpaperengine n'est pas installé — c'est wallpaper.jpg qui
# est affiché par hyprpaper, comme pour les autres thèmes.
#
# bg : un identifiant Steam Workshop (le nombre à la fin de l'URL de la page
#      du fond) ou le chemin d'un dossier de fond.

#bg=2759992376
fps=24
scaling=fill

# Dossier `assets` de Wallpaper Engine, s'il n'est pas dans un emplacement
# Steam standard (détecté automatiquement sinon).
#assets_dir=
