# ─── kitty — apparence ─── Sakura ────────────────────────────────────────────
# Inclus par ~/.config/kitty/kitty.conf via themes/current/kitty.conf.
#
# Terminal sombre et translucide : fond brun-noir, laissé à 72 % pour
# que le fond d'écran — flouté par Hyprland — transparaisse en halo chaud.

font_family      ComicShannsMono Nerd Font
font_size        11.0

# 0.72 : en dessous, le disque clair de la lune derrière le texte gêne la
# lecture malgré le flou ; au-dessus, on perd l'effet.
background_opacity 0.72

cursor_shape        beam
cursor_beam_thickness 1.5
window_padding_width 10

# ── Palette ──
foreground           #f5e6e0
background           #1f1513
selection_foreground #1f1513
selection_background #f5bfae

cursor               #f5bfae
cursor_text_color    #1f1513

url_color            #8fb4dc

active_border_color   #e0604f
inactive_border_color #7d4439

active_tab_foreground   #1f1513
active_tab_background   #e0604f
inactive_tab_foreground #a8918a
inactive_tab_background #2b1d1a

# noir / gris — écorce
color0  #3a2824
color8  #6e5952
# rouge — camélia
color1  #ff6b7a
color9  #ff8c98
# vert — jeune feuille
color2  #9fc79a
color10 #b6d9b1
# jaune — miel
color3  #e0b872
color11 #ecca8f
# bleu — ciel de nuit
color4  #8fb4dc
color12 #a8c6e8
# magenta — la couleur signature
color5  #e0604f
color13 #f5bfae
# cyan — eau de rivière
color6  #7fc4c4
color14 #9ad6d6
# blanc — pétale
color7  #e5d2cb
color15 #fbf4f0
