# ─── GTK / curseur — apparence ─── Sakura ────────────────────────────────────
# Lu par theme-switch (voir themes/frutiger-aero/gtk.conf pour le format).
#
# Adwaita sombre : c'est déjà un thème sobre, et il est compilé dans GTK — rien
# à installer. Pour un accent rose dans les applis libadwaita, on pourra plus
# tard poser un gtk-4.0/gtk.css qui redéfinit @accent_bg_color.

gtk_theme=Adwaita
icon_theme=Papirus-Dark
cursor_theme=Adwaita
cursor_size=24
font=Inter 11
document_font=Inter 11
monospace_font=ComicShannsMono Nerd Font 11
color_scheme=prefer-dark
