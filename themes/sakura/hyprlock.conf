# ─── hyprlock — apparence ─── Sakura ─────────────────────────────────────────
# Sourcé par ~/.config/hypr/hyprlock.conf via themes/current/hyprlock.conf.
#
# Le fond reste l'image fixe (wallpaper.jpg), même quand le bureau utilise un
# fond Wallpaper Engine : hyprlock ne sait afficher qu'un fichier image.

background {
    monitor =
    path = ~/.config/themes/current/wallpaper.jpg
    blur_passes = 2
    blur_size = 6
    brightness = 0.85
    contrast = 1.0
    vibrancy = 0.0
}

input-field {
    monitor =
    size = 280, 46
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.3
    dots_center = true
    rounding = 8
    outer_color = rgba(e0604fff)
    inner_color = rgba(1f1513b3)
    font_color = rgba(f5e6e0ff)
    fade_on_empty = false
    placeholder_text = <span foreground="##a8918a">Mot de passe</span>
    fail_text = <span foreground="##ff6b7a">$FAIL <b>($ATTEMPTS)</b></span>
    check_color = rgba(9fc79aff)
    fail_color = rgba(ff6b7aff)
    capslock_color = rgba(e0b872ff)
    position = 0, -70
    halign = center
    valign = center
}

# Fond sombre → texte clair, sans ombre portée.
label {
    monitor =
    text = $TIME
    color = rgba(f5e6e0ff)
    font_size = 68
    font_family = Inter Light
    position = 0, 150
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A %d %B"
    color = rgba(f5bfaeff)
    font_size = 16
    font_family = Inter
    position = 0, 75
    halign = center
    valign = center
}
