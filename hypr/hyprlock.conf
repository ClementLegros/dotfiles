general {
    disable_loading_bar = true
    hide_cursor = true
}

background {
    monitor =
    path = ~/.config/hypr/wallpaper.jpg
    blur_passes = 2
    blur_size = 5
    brightness = 0.7
}

input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    outer_color = rgb(313244)
    inner_color = rgb(1e1e2e)
    font_color = rgb(cdd6f4)
    fade_on_empty = true
    placeholder_text = <span foreground="##a6adc8">Mot de passe...</span>
    fail_text = <span foreground="##f38ba8">$FAIL <b>($ATTEMPTS)</b></span>
    check_color = rgb(a6e3a1)
    fail_color = rgb(f38ba8)
    capslock_color = rgb(fab387)
    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(cdd6f4ff)
    font_size = 64
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A %d %B"
    color = rgba(b4befeff)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}
