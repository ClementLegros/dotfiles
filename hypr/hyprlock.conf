# Comportement de l'écran de verrouillage — hors thème, pour rester stable
# d'un thème à l'autre.
general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    ignore_empty_input = true
}


# Apparence (fond, champ de saisie, horloge) : fournie par le thème actif.
# Bascule : `theme-switch <nom>` — voir ~/.config/themes/.
source = ~/.config/themes/current/hyprlock.conf
