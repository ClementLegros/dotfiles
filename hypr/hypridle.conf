# hypridle — mise en veille automatique.
#
# Tu avais hyprlock sans démon d'idle : rien ne verrouillait ni n'éteignait
# l'écran tout seul. Voici la chaîne standard, en quatre paliers.
#
# Depuis la config Lua de Hyprland, `hyprctl dispatch` prend une expression
# `hl.dsp.*` : l'ancienne forme `hyprctl dispatch dpms off` répond
# « Invalid dispatcher »… avec un code de retour 0, donc en silence.

general {
    # Verrouille AVANT de suspendre, sinon la session revient déverrouillée.
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    # Au réveil, rallumer l'écran : sans ça, dpms reste off et l'écran semble
    # mort jusqu'à un mouvement de souris.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
    ignore_dbus_inhibit = false
}

# 2,5 min — on baisse la luminosité : un avertissement doux, sans rien couper.
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# 5 min — verrouillage.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5,5 min — extinction de la dalle.
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 30 min — suspension.
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
