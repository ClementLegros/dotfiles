ipc = true
splash = false

# Le fond d'écran fait partie du thème actif.
# Bascule : `theme-switch <nom>` — voir ~/.config/themes/.

wallpaper {
    monitor = eDP-1
    path = ~/.config/themes/current/wallpaper.jpg
    fit_mode = cover
}

wallpaper {
    monitor =
    path = ~/.config/themes/current/wallpaper.jpg
    fit_mode = cover
}
